<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A dramatic, responsive movie poster design.">
  <title>Movie Poster Assignment 3</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Roboto+Condensed:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>
  <main class="page">
    <article class="poster" aria-label="Action movie poster">
      <img class="poster__image" src="poster.jpg" alt="Action movie artwork showing a man wearing sunglasses in a dramatic action scene">

      <div class="poster__shade" aria-hidden="true"></div>

      <header class="poster__top">
        <p class="poster__brand">LOREX</p>
        <p class="poster__brand">IPSUM</p>
      </header>

      <section class="poster__title" aria-label="Movie title">
        <p class="poster__eyebrow">LOREM IPSUM</p>
        <h1>MOVIE</h1>
      </section>

      <footer class="poster__footer">
        <p>
          LOREM IPSUM DOLOR SIT AMET, CONSECTETUR ADIPISCING ELIT, SED DO EIUSMOD
          TEMPOR INCIDIDUNT UT LABORE ET DOLORE MAGNA ALIQUA. QUIS IPSUM
          SUSPENDISSE ULTRICES GRAVIDA. RISUS COMMODO VIVERRA MAECENAS
          ACCUMSAN LACUS VEL FACILISIS 2024.
        </p>
      </footer>
    </article>
  </main>
</body>
</html>
